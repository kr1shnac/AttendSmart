version: "3.8"

# ============================================
# AttendSmart Development Infrastructure
# ============================================
# Services:
#   - Redis: BullMQ queue backend
#   - Face-Engine: Python face verification service
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up -d redis        # Start only Redis
#   docker-compose logs face-engine   # View face-engine logs
#   docker-compose down               # Stop all services
# ============================================

services:
  redis:
    image: redis:7-alpine
    container_name: attendsmart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Enable AOF persistence - queue survives restarts
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Resource limits to prevent runaway memory usage
    deploy:
      resources:
        limits:
          memory: 256M

  # Python Face Verification Microservice
  face-engine:
    build:
      context: ./face-engine
      dockerfile: Dockerfile
    container_name: attendsmart-face-engine
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - FLASK_DEBUG=false
      - FACE_CONFIDENCE_THRESHOLD=0.6
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  redis_data:
    driver: local
